name: Tests

on: [push, pull_request]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set TERM variable
        run: echo "TERM=xterm-256color" >> $GITHUB_ENV

      - name: Install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Install shellcheck (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Set execute permissions
        run: chmod +x ./tests/main.sh

      - name: Run tests
        run: ./tests/main.sh

      - name: Display bash version
        run: bash --version

      - name: Test utilities.sh sourcing
        run: |
          # Test that utilities.sh can be sourced
          bash -c 'source utilities.sh && echo "✓ utilities.sh sourced successfully"'

      - name: Test debug mode
        run: |
          bash -c 'export UTILITIES_DEBUG=true; source utilities.sh' 2>&1 | grep -q "\[utilities\]" && echo "✓ Debug mode working"

      - name: Test version constant
        run: |
          bash -c 'source utilities.sh && [[ -n "$UTILITIES_VERSION" ]] && echo "✓ Version: $UTILITIES_VERSION"'

      - name: Run integration tests
        run: ./tests/integration_test.sh

  flox-smoke-test:
    name: Flox manifest smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Flox
        uses: flox/install-flox-action@main

      - name: Verify pinned toolchain activates
        run: |
          flox activate -- bash -c '
            set -euo pipefail
            echo "Toolchain versions inside flox activate:"
            bash --version | head -1
            shellcheck --version | head -3
            node --version
            echo "Running shellcheck suite with the pinned toolchain:"
            ./tests/main.sh
          '
